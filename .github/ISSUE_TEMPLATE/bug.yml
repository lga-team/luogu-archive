name: Bug 反馈
description: 部分功能有问题
title: "[Bug] "
labels: ["bug"]
type: "Bug"
assignees: ["px-poxiao"]

body:
- type: markdown
  attributes:
    value: "我们很高兴您来到这里！请填写以下表单以报告洛谷档案馆的 Bug："
- type: checkboxes
  id: confirm
  attributes:
    label: 检查单
    options:
    - label: 这个 Bug 没有在最新版本中修复。
      required: true
    - label: 我已搜索过 [Issues 列表](https://github.com/px-poxiao/luogu-archive/issues) 且确认了这个 Bug 没有被提出过。
      required: true
- type: dropdown
  id: browser
  attributes:
    label: 浏览器
    description: "您在使用的浏览器。"
    options:
      - Google Chrome
      - Mozilla Firefox
      - Microsoft Edge
      - Safari
      - Opera
      - 其它（请在下面的输入框中标注）
  validations:
    required: true
- type: input
  id: browser_version
  attributes:
    label: 浏览器版本
    description: "注明您的浏览器版本。"
    placeholder: "155.0.4283.62 / Brave 1.92.144"
  validations:
    required: true
- type: input
  id: os
  attributes:
    label: 操作系统
    description: "包括系统名称和版本。"
    placeholder: "Windows 11 26H2 / macOS 14.5 / Ubuntu 22.04"
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Bug 描述
    description: "详细描述该 Bug 的具体表现。"
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: 复现步骤
    description: "详细描述再次触发这个 Bug 的步骤。"
  validations:
    required: false
- type: textarea
  id: console
  attributes:
    label: 控制台错误信息
    description: "把控制台错误信息粘贴到这里。"
  validations:
    required: false
